name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e "packages/hollersports[dev]"
      - name: Unit, integration, golden tests
        run: pytest tests/ --ignore=hollersports-core -q
      - name: Operator day smoke
        run: python scripts/smoke_operator_day.py --out docs/evidence/smoke_operator_day.last.json

  operator-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/operator-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/operator-web/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Guardrail — no live UX
        run: |
          if grep -RInE 'Place bet|LIVE_APPROVED|placeBet' --exclude-dir=node_modules --exclude-dir=.next .; then
            echo "Forbidden live UX strings found" >&2
            exit 1
          fi
