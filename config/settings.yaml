# HollerSports Configuration
# ABX-Core v1.2 compliant: all tunables exposed, deterministic, config-driven

# Core settings
seed: 42
log_level: INFO
config_path: config/settings.yaml

# VenueImpactEngine settings
venue:
  enabled: true
  arenas_data_path: config/arenas.json
  default_pace_modifier: 1.0
  default_three_point_modifier: 1.0
  altitude_threshold_m: 1000

# RolePriorityTagger settings
roles:
  enabled: true
  min_games_for_inference: 5
  usage_hinge_threshold: 28.0
  high_assist_threshold: 25.0
  glass_cleaner_trb_threshold: 18.0
  confidence_decay_per_missing_game: 0.05

# GameScriptSimulator settings
scripts:
  enabled: true
  num_scripts_per_matchup: 5
  pace_band_width: 3.0
  fragility_high_threshold: 0.6
  fragility_low_threshold: 0.25

# PropRiskScorer settings
prop_risk:
  min_ev_threshold: 0.03
  high_ev_threshold: 0.10
  volatility_penalty_weight: 0.3
  fragility_penalty_weight: 0.5

# ParlayBuilder v2 settings
parlays:
  # Conservative mode
  conservative_max_fragility: 0.3
  conservative_min_ev: 0.05

  # Balanced mode
  balanced_max_fragility: 0.5
  balanced_min_ev: 0.03

  # Aggressive mode
  aggressive_max_fragility: 0.75
  aggressive_min_ev: 0.01

  # General
  max_legs_same_game: 2
  min_legs: 2
  max_legs: 8

# API settings
api_host: "0.0.0.0"
api_port: 8000

# Data settings
data_cache_ttl_seconds: 300
