[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hollersports-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hollersports_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
