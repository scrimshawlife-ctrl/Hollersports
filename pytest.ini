[pytest]
testpaths = tests
pythonpath = packages/hollersports
addopts =
    -q
    --strict-markers
    --tb=short
markers =
    unit: fast pure unit tests
    integration: API / multi-module tests
    golden: determinism / authority goldens
    calibration: advice-quality calibration ladder + model-edge gates
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
